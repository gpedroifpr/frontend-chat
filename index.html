<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Enigma Master - Tempo Real & Animações</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #fff; }
        .game-wrapper { display: flex; gap: 20px; max-width: 950px; width: 100%; padding: 20px; box-sizing: border-box; }
        .chat-container { background: #161233; flex: 1.5; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .ranking-container { background: #161233; flex: 1; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .auth-container { background: #161233; padding: 30px; border-radius: 10px; width: 350px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
        .historico { height: 300px; overflow-y: auto; background: #0f0c24; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #332a63; }
        .mensagem { margin-bottom: 10px; padding: 8px; border-radius: 5px; line-height: 1.4; word-wrap: break-word; }
        .user { background: #007bff; color: white; text-align: right; margin-left: 20%; }
        .bot { background: #2a2456; color: #fff; text-align: left; margin-right: 20%; border: 1px solid #483d8b; }
        .controles { display: flex; flex-direction: column; gap: 8px; }
        .input-linha { display: flex; gap: 5px; }
        input[type="text"], input[type="password"] { padding: 10px; border: 1px solid #332a63; border-radius: 5px; background: #0f0c24; color: #fff; box-sizing: border-box; }
        .input-text { flex: 1; }
        button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-enviar { background: #28a745; color: white; }
        .btn-limpar { background: #dc3545; color: white; width: 100%; margin-top: 10px; }
        .btn-ranking { background: #ffc107; color: #111; width: 100%; margin-bottom: 10px; }
        .btn-logout { background: #dc3545; color: white; padding: 5px 10px; font-size: 0.8em; margin-left: auto; }
        .ranking-list { list-style: none; padding: 0; margin: 0; }
        .ranking-item { padding: 8px; border-bottom: 1px solid #332a63; display: flex; justify-content: space-between; font-size: 0.9em; }
        .user-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; background: #0f0c24; padding: 10px; border-radius: 5px; border: 1px solid #332a63; }
        .toggle-auth { color: #ffc107; cursor: pointer; text-decoration: underline; font-size: 0.9em; margin-top: 15px; display: inline-block; }
        .upload-secao { display: flex; align-items: center; gap: 8px; background: #0f0c24; padding: 5px; border-radius: 5px; border: 1px solid #332a63; font-size: 0.85em; color: #ccc; }
        .upload-secao input[type="file"] { font-size: 0.8em; color: #ccc; }
        #previewContainer { display: none; margin-bottom: 5px; }
        #imgPreview { max-height: 70px; border-radius: 5px; border: 1px solid #332a63; }
        .health-badge { display: flex; align-items: center; gap: 8px; font-size: 0.75em; margin-bottom: 8px; color: #aaa; background: #0f0c24; padding: 5px 8px; border-radius: 5px; border: 1px solid #332a63; }
        .dot { height: 8px; width: 8px; background-color: #777; border-radius: 50%; display: inline-block; }
        
        /* Animação de digitação (Bolinhas pulando) */
        .typing-bubble { display: none; align-items: center; gap: 4px; padding: 10px 14px; background: #2a2456; border: 1px solid #483d8b; border-radius: 5px; width: fit-content; margin-bottom: 10px; }
        .typing-dot { height: 6px; width: 6px; background-color: #bbb; border-radius: 50%; display: inline-block; animation: bounce 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(2) { animation-delay: -0.2s; }
        .typing-dot:nth-child(3) { animation-delay: -0.4s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
    </style>
</head>
<body>

    <div class="auth-container" id="authBox">
        <h2 id="authTitle">🔮 Enigma SaaS</h2>
        <div id="loginForm">
            <input type="text" id="loginEmail" placeholder="Seu e-mail..." style="width: 100%; margin-bottom: 10px;">
            <input type="password" id="loginSenha" placeholder="Sua senha..." style="width: 100%; margin-bottom: 10px;">
            <button onclick="fazerLogin()" style="background: #28a745; color: white; width: 100%;">Entrar</button>
            <span class="toggle-auth" onclick="toggleAuth(false)">Não tem cadastro? Crie uma conta aqui</span>
        </div>
        <div id="registerForm" style="display: none;">
            <input type="text" id="regNome" placeholder="Seu nome ou apelido..." style="width: 100%; margin-bottom: 10px;">
            <input type="text" id="regEmail" placeholder="Seu e-mail..." style="width: 100%; margin-bottom: 10px;">
            <input type="password" id="regSenha" placeholder="Escolha uma senha..." style="width: 100%; margin-bottom: 10px;">
            <button onclick="fazerCadastro()" style="background: #ffc107; color: #111; width: 100%;">Cadastrar Conta</button>
            <span class="toggle-auth" onclick="toggleAuth(true)">Já tem conta? Faça Login</span>
        </div>
    </div>

    <div class="game-wrapper" id="gameBox" style="display: none;">
        <div class="chat-container">
            <div class="health-badge">
                <span class="dot" id="statusDot"></span>
                <span id="statusText">Verificando saúde da API...</span>
            </div>

            <div class="user-header">
                <span id="userLogado" style="color: #ffc107; font-weight: bold;"></span>
                <button class="btn-logout" onclick="fazerLogout()">Sair (Logout)</button>
            </div>

            <div class="historico" id="historico">
                <div class="mensagem bot">Conectando à sala em tempo real...</div>
            </div>

            <!-- Animação de Digitando da IA -->
            <div class="typing-bubble" id="typingIndicator">
                <span style="font-size: 0.8em; color: #ccc; margin-right: 4px;">Moderador Gemini está digitando</span>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>

            <div id="previewContainer">
                <img id="imgPreview" src="" alt="Preview">
                <button onclick="removerAnexo()" style="background: #dc3545; color: white; padding: 2px 6px; font-size: 0.65em;">Remover Imagem</button>
            </div>
            
            <div class="controles">
                <div class="upload-secao">
                    <span>📷 Imagem:</span>
                    <input type="file" id="imagemUpload" accept="image/*" onchange="mostrarPreview()">
                </div>
                <div class="upload-secao">
                    <span>📄 Documento (PDF/TXT):</span>
                    <input type="file" id="docUpload" accept=".pdf, .txt">
                </div>
                <div class="input-linha">
                    <input type="text" id="pergunta" class="input-text" placeholder="Digite no chat ou digite @gemini...">
                    <button class="btn-enviar" onclick="enviarMensagem()">Enviar</button>
                </div>
            </div>
            <button class="btn-limpar" onclick="limparConversa()">🗑️ Limpar Conversa</button>
        </div>

        <div class="ranking-container">
            <h3>🏆 Leaderboard Global</h3>
            <button class="btn-ranking" onclick="buscarRanking()">🔄 Atualizar Classificação</button>
            <div style="overflow-y: auto; flex: 1;">
                <ul class="ranking-list" id="rankingList">
                    <li style="color: #777; font-style: italic; text-align: center;">Buscando dados no ranking...</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        const URL_BASE = "https://agente-de-ia-postman.onrender.com";
        const URL_BACKEND = `${URL_BASE}/api/chat`;
        let socket;

        window.onload = function() {
            testarHealthCheck();
            const token = localStorage.getItem('token_saas');
            const nome = localStorage.getItem('nome_saas');
            if (token && nome) {
                iniciarSessao(nome);
            }
        };

        async function testarHealthCheck() {
            const dot = document.getElementById("statusDot");
            const text = document.getElementById("statusText");
            try {
                const res = await fetch(`${URL_BASE}/api/health`);
                const data = await res.json();
                if (res.ok && data.status === "ok") {
                    dot.style.backgroundColor = "#28a745";
                    text.innerText = "Sistema Operacional (DB Conectado) 🟢";
                } else {
                    dot.style.backgroundColor = "#dc3545";
                    text.innerText = "API com instabilidade 🔴";
                }
            } catch (e) {
                dot.style.backgroundColor = "#dc3545";
                text.innerText = "Servidor Offline 🔴";
            }
        }

        function toggleAuth(showLogin) {
            document.getElementById("authTitle").innerText = showLogin ? "🔮 Enigma SaaS" : "✍️ Criar Conta";
            document.getElementById("loginForm").style.display = showLogin ? "block" : "none";
            document.getElementById("registerForm").style.display = showLogin ? "none" : "block";
        }

        function mostrarPreview() {
            const upload = document.getElementById("imagemUpload");
            const preview = document.getElementById("imgPreview");
            const container = document.getElementById("previewContainer");
            const file = upload.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    container.style.display = "block";
                }
                reader.readAsDataURL(file);
            }
        }

        function removerAnexo() {
            document.getElementById("imagemUpload").value = "";
            document.getElementById("previewContainer").style.display = "none";
        }

        async function fazerCadastro() {
            const nome = document.getElementById("regNome").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const senha = document.getElementById("regSenha").value.trim();
            if (!nome || !email || !senha) return alert("Preencha todos os campos!");
            try {
                const resposta = await fetch(`${URL_BASE}/api/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nome, email, senha })
                });
                const dados = await resposta.json();
                if (dados.sucesso) {
                    alert("Cadastro concluído! Faça o login.");
                    toggleAuth(true);
                } else {
                    alert(dados.erro || "Erro ao cadastrar.");
                }
            } catch { alert("Erro de conexão ao cadastrar."); }
        }

        async function fazerLogin() {
            const email = document.getElementById("loginEmail").value.trim();
            const senha = document.getElementById("loginSenha").value.trim();
            if (!email || !senha) return alert("Preencha todos os campos!");
            try {
                const resposta = await fetch(`${URL_BASE}/api/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, senha })
                });
                const dados = await resposta.json();
                if (dados.sucesso) {
                    localStorage.setItem('token_saas', dados.token);
                    localStorage.setItem('nome_saas', dados.nome);
                    iniciarSessao(dados.nome);
                } else {
                    alert(dados.erro || "E-mail ou senha incorretos.");
                }
            } catch { alert("Erro de conexão ao fazer login."); }
        }

        function iniciarSessao(nomeLogado) {
            document.getElementById("authBox").style.display = "none";
            document.getElementById("gameBox").style.display = "flex";
            document.getElementById("userLogado").innerText = `🎮 Jogador: ${nomeLogado}`;
            
            carregarHistorico();
            buscarRanking();

            const token = localStorage.getItem('token_saas');
            socket = io(URL_BASE, { auth: { token: token } });

            // Escuta mensagens chegando em tempo real
            socket.on('mensagemRecebida', (dados) => {
                const historicoDiv = document.getElementById("historico");
                let conteudo = marked.parse(dados.texto || "");
                let classeCss = dados.tipo === 'ia' ? 'bot' : (dados.remetente === nomeLogado ? 'user' : 'bot');

                historicoDiv.innerHTML += `
                    <div class="mensagem ${classeCss}">
                        <b>${dados.remetente}:</b><br>${conteudo}
                    </div>
                `;
                historicoDiv.scrollTop = historicoDiv.scrollHeight;
                buscarRanking();
            });

            // Ouve evento de digitação da IA
            socket.on('statusDigitando', (dados) => {
                const typing = document.getElementById("typingIndicator");
                typing.style.display = dados.status ? "flex" : "none";
                const historicoDiv = document.getElementById("historico");
                historicoDiv.scrollTop = historicoDiv.scrollHeight;
            });
        }

        function fazerLogout() {
            localStorage.removeItem('token_saas');
            localStorage.removeItem('nome_saas');
            if (socket) socket.disconnect();
            window.location.reload();
        }

        async function carregarHistorico() {
            const historicoDiv = document.getElementById("historico");
            const token = localStorage.getItem('token_saas');
            if (!token) return;
            try {
                const resposta = await fetch(`${URL_BACKEND}/historico`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const dados = await resposta.json();
                historicoDiv.innerHTML = "";
                dados.forEach(msg => {
                    const nomeRemetente = msg.remetente === 'usuario' ? 'Você' : '🤖 Robô';
                    const classe = msg.remetente === 'usuario' ? 'user' : 'bot';
                    let conteudo = marked.parse(msg.texto || "");
                    if (msg.imagemUrl) {
                        conteudo += `<br><img src="${msg.imagemUrl}" style="max-width: 100%; max-height: 150px; border-radius: 5px; margin-top: 5px; border: 1px solid #332a63;">`;
                    }
                    historicoDiv.innerHTML += `<div class="mensagem ${classe}"><b>${nomeRemetente}:</b><br>${conteudo}</div>`;
                });
                historicoDiv.scrollTop = historicoDiv.scrollHeight;
            } catch (erro) { console.error("Erro ao carregar histórico:", erro); }
        }

        async function enviarMensagem() {
            const input = document.getElementById("pergunta");
            const inputImagem = document.getElementById("imagemUpload");
            const inputDoc = document.getElementById("docUpload");
            
            const texto = input.value.trim();
            const arquivoImagem = inputImagem.files[0];
            const arquivoDoc = inputDoc.files[0];
            const token = localStorage.getItem('token_saas');

            if((!texto && !arquivoImagem && !arquivoDoc) || !token) return;

            input.value = "";
            removerAnexo();
            document.getElementById("docUpload").value = "";

            try {
                if (arquivoDoc || arquivoImagem) {
                    const historico = document.getElementById("historico");
                    historico.innerHTML += `<div class="mensagem user"><b>Você:</b><br>${texto || "[Arquivo enviado]"}</div>`;
                    historico.innerHTML += `<div class="mensagem bot" id="loading">Processando arquivo na nuvem...</div>`;
                    historico.scrollTop = historico.scrollHeight;

                    let resposta;
                    if (arquivoDoc) {
                        const formData = new FormData();
                        formData.append("pergunta", texto || "Resuma este documento.");
                        formData.append("documento", arquivoDoc);
                        resposta = await fetch(`${URL_BASE}/api/chat/documento`, {
                            method: "POST",
                            headers: { "Authorization": `Bearer ${token}` },
                            body: formData
                        });
                    } else {
                        const formData = new FormData();
                        formData.append("pergunta", texto || "Analise esta imagem.");
                        formData.append("imagem", arquivoImagem);
                        resposta = await fetch(`${URL_BACKEND}/vision`, {
                            method: "POST",
                            headers: { "Authorization": `Bearer ${token}` },
                            body: formData
                        });
                    }

                    const dados = await resposta.json();
                    document.getElementById("loading").remove();

                    if (!resposta.ok) {
                        alert(dados.erro || "Ocorreu um erro no servidor.");
                        return;
                    }

                    const respostaFormatada = marked.parse(dados.resposta);
                    historico.innerHTML += `<div class="mensagem bot"><b>🤖 Robô:</b><br>${respostaFormatada}</div>`;
                    historico.scrollTop = historico.scrollHeight;
                    buscarRanking();
                } 
                else {
                    // Texto via WebSocket (inclui @gemini)
                    if (socket && socket.connected) {
                        socket.emit('novaMensagem', { texto: texto });
                    } else {
                        alert("Conexão perdida. Recarregue a página.");
                    }
                }
            } catch (erro) {
                console.error("Erro ao enviar mensagem:", erro);
            }
        }

        async function buscarRanking() {
            const rankingList = document.getElementById("rankingList");
            const token = localStorage.getItem('token_saas');
            if (!token) return;
            try {
                const resposta = await fetch(`${URL_BASE}/api/ranking`, {
                    headers: { "Authorization": `Bearer ${token}` }
                });
                const dados = await resposta.json();
                rankingList.innerHTML = "";

                if (dados.length === 0) {
                    rankingList.innerHTML = `<li style="color: #777; font-style: italic; text-align: center; padding: 10px;">Nenhum herói no ranking ainda.</li>`;
                    return;
                }

                dados.forEach((jogador, index) => {
                    let medalha = index === 0 ? "🥇 " : index === 1 ? "🥈 " : index === 2 ? "🥉 " : "";
                    rankingList.innerHTML += `
                        <li class="ranking-item">
                            <span>${medalha}<b>${index + 1}º</b> - ${jogador.nome}</span>
                            <span style="color: #ffc107; font-weight: bold;">${jogador.xp} XP</span>
                        </li>
                    `;
                });
            } catch (erro) {
                rankingList.innerHTML = `<li style="color: #dc3545; text-align: center;">Erro ao carregar o ranking ❌</li>`;
            }
        }

        async function limparConversa() {
            const historico = document.getElementById("historico");
            const token = localStorage.getItem('token_saas');
            if (!token) return;
            if(confirm("Deseja limpar as mensagens locais e o histórico?")) {
                try {
                    const resposta = await fetch(`${URL_BACKEND}/limpar`, { 
                        method: "DELETE",
                        headers: { "Authorization": `Bearer ${token}` }
                    });
                    const resultado = await resposta.json();
                    if(resultado.sucesso) {
                        historico.innerHTML = `<div class="mensagem bot" style="font-style: italic; color: #ffc107;">Memória limpa. Digite uma mensagem para recomeçar o jogo!</div>`;
                    }
                } catch (erro) {
                    alert("Erro ao tentar limpar o histórico do servidor.");
                }
            }
        }
    </script>
</body>
</html>
