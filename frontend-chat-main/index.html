<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Enigma Master - IA Gamificada</title>
    <!-- Marked.js para ler Markdown das respostas -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Canvas-Confetti para animações (Desafio Hacker) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #fff; }
        .game-wrapper { display: flex; gap: 20px; max-width: 900px; width: 100%; padding: 20px; }
        .chat-container { background: #161233; flex: 1.5; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .ranking-container { background: #161233; flex: 1; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; }
        .historico { height: 300px; overflow-y: auto; background: #0f0c24; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #332a63; }
        .mensagem { margin-bottom: 10px; padding: 8px; border-radius: 5px; line-height: 1.4; }
        .user { background: #007bff; color: white; text-align: right; margin-left: 20%; }
        .bot { background: #2a2456; color: #fff; text-align: left; margin-right: 20%; border: 1px solid #483d8b; }
        .controles { display: flex; gap: 5px; margin-top: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #332a63; border-radius: 5px; background: #0f0c24; color: #fff; }
        button { padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-enviar { background: #28a745; color: white; }
        .btn-limpar { background: #dc3545; color: white; width: 100%; margin-top: 10px; }
        .btn-ranking { background: #ffc107; color: #111; width: 100%; margin-bottom: 10px; }
        .ranking-list { list-style: none; padding: 0; margin: 0; }
        .ranking-item { padding: 8px; border-bottom: 1px solid #332a63; display: flex; justify-content: space-between; font-size: 0.9em; }
        .login-box { display: flex; gap: 5px; margin-bottom: 15px; background: #0f0c24; padding: 10px; border-radius: 5px; border: 1px solid #332a63; }
        .user-logado { color: #ffc107; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <!-- ÁREA DO CHAT DO JOGO -->
        <div class="chat-container">
            <h2>🔮 O Guardião do Cofre</h2>
            
            <!-- Identificando o Jogador (Fase 1) -->
            <div class="login-box" id="loginBox">
                <input type="text" id="nickname" placeholder="Digite seu apelido/nickname para jogar...">
                <button onclick="salvarNickname()" style="background: #ffc107; color: #111;">Entrar</button>
            </div>
            
            <div class="user-logado" id="userLogado" style="display: none;"></div>

            <div class="historico" id="historico">
                <div class="mensagem bot">Olá! Digite seu nickname acima para começar a enfrentar os desafios de conhecimento do Guardião!</div>
            </div>
            
            <div class="controles">
                <input type="text" id="pergunta" placeholder="Escreva sua resposta ou pergunta..." disabled>
                <button class="btn-enviar" id="btnEnviar" onclick="enviarMensagem()" disabled>Enviar</button>
            </div>
            <button class="btn-limpar" onclick="limparConversa()">🗑️ Limpar Conversa</button>
        </div>

        <!-- TABELA DE RANKING (Fase 5) -->
        <div class="ranking-container">
            <h3>🏆 Leaderboard Global</h3>
            <button class="btn-ranking" onclick="buscarRanking()">🔄 Atualizar Classificação</button>
            <div style="overflow-y: auto; flex: 1;">
                <ul class="ranking-list" id="rankingList">
                    <li style="color: #777; font-style: italic; text-align: center;">Clique para carregar o ranking...</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        const URL_BASE = "https://agente-de-ia-postman.onrender.com";
        const URL_BACKEND = `${URL_BASE}/api/chat`;
        let nicknameLogado = "";

        // Fase 1: Salva o apelido localmente para usar no chat
        function salvarNickname() {
            const inputNick = document.getElementById("nickname");
            const nick = inputNick.value.trim();

            if (!nick) {
                alert("Por favor, digite um nickname válido para começar!");
                return;
            }

            nicknameLogado = nick;
            document.getElementById("loginBox").style.display = "none";
            
            const txtLogado = document.getElementById("userLogado");
            txtLogado.innerText = `🎮 Jogador: ${nicknameLogado}`;
            txtLogado.style.display = "block";

            // Ativa os campos de envio
            document.getElementById("pergunta").disabled = false;
            document.getElementById("btnEnviar").disabled = false;

            document.getElementById("historico").innerHTML += `
                <div class="mensagem bot">Bem-vindo, <b>${nicknameLogado}</b>! Diga algo como "Quero começar o jogo" e prepare-se para as charadas!</div>
            `;
            buscarRanking();
        }

        async function enviarMensagem() {
            const input = document.getElementById("pergunta");
            const historico = document.getElementById("historico");
            const texto = input.value;

            if(!texto || !nicknameLogado) return;

            // 1. Mostra a mensagem do usuário na tela
            historico.innerHTML += `<div class="mensagem user">${texto}</div>`;
            input.value = "";
            historico.innerHTML += `<div class="mensagem bot" id="loading">Pesando resposta...</div>`;
            historico.scrollTop = historico.scrollHeight;

            try {
                // 2. Faz o Fetch (POST) com nickname (Fase 1)
                const resposta = await fetch(URL_BACKEND, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        pergunta: texto,
                        nickname: nicknameLogado
                    })
                });

                const dados = await resposta.json();

                // 3. Remove o "Pensando..."
                document.getElementById("loading").remove();

                // CONVERTE A RESPOSTA COM MARKDOWN PARA HTML
                const respostaFormatada = marked.parse(dados.resposta);
                historico.innerHTML += `<div class="mensagem bot">${respostaFormatada}</div>`;
                
                // Desafio Hacker: Estourar Confete na tela ao acertar (Fase 5)
                const textoLower = dados.resposta.toLowerCase();
                if (textoLower.includes("acertou") || textoLower.includes("parabéns") || textoLower.includes("parabens")) {
                    confetti({
                        particleCount: 150,
                        spread: 80,
                        origin: { y: 0.6 }
                    });
                }

                // Rola o chat para baixo e atualiza ranking
                historico.scrollTop = historico.scrollHeight;
                buscarRanking();

            } catch (erro) {
                document.getElementById("loading").innerHTML = "Erro de conexão com o Servidor ❌";
            }
        }

        // Busca o ranking dos top 10 (Fase 5)
        async function buscarRanking() {
            const rankingList = document.getElementById("rankingList");
            try {
                const resposta = await fetch(`${URL_BASE}/api/ranking`);
                const dados = await resposta.json();

                rankingList.innerHTML = "";

                dados.forEach((jogador, index) => {
                    let medalha = "";
                    if (index === 0) medalha = "🥇 ";
                    else if (index === 1) medalha = "🥈 ";
                    else if (index === 2) medalha = "🥉 ";

                    rankingList.innerHTML += `
                        <li class="ranking-item">
                            <span>${medalha}<b>${index + 1}º</b> - ${jogador.nome}</span>
                            <span style="color: #ffc107; font-weight: bold;">${jogador.xp} XP</span>
                        </li>
                    `;
                });

            } catch (erro) {
                rankingList.innerHTML = `<li style="color: #dc3545; text-align: center;">Erro ao carregar o ranking ❌</li>`;
            }
        }

        async function limparConversa() {
            const historico = document.getElementById("historico");
            if(confirm("Deseja limpar as mensagens locais e o histórico?")) {
                try {
                    const resposta = await fetch(`${URL_BACKEND}/limpar`, { method: "DELETE" });
                    const resultado = await resposta.json();
                    if(resultado.sucesso) {
                        historico.innerHTML = `<div class="mensagem bot" style="font-style: italic; color: #ffc107;">Memória limpa. Digite uma mensagem para recomeçar o jogo!</div>`;
                    }
                } catch (erro) {
                    alert("Erro ao tentar limpar o histórico do servidor.");
                }
            }
        }
    </script>
</body>
</html>
